<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        .wrapper {
            position: relative;
            width: 1000px;
        }
        .regular {
            position: absolute;
            width: 400px;
            height: 300px;
            background-color: skyblue;
            left: 10px;
        }
        .important {
            position: absolute;
            width: 300px;
            height: 300px;
            background-color: crimson;
            left: 420px;
        }
        .moreImportant {
            position: absolute;
            left: 740px;
            background-color: limegreen;
        }
        @media screen and (max-width: 600px) {
            .important {
            left: 20px;
            }
            .moreImportant {
                left: 2px;
                top: 2px;
            }
        }
        @media screen and (min-width: 800px) {
            .moreImportant {
                background-color: maroon;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
    <div class="regular"></div>
    <div class="important"></div>
    <div class="moreImportant">
        Some text
    </div>
    </div>
</body>
</html>
