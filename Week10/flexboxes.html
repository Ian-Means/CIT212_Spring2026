<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>
        * {
            box-sizing: border-box;
        }
        .wrapper {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            height: auto;
            background-color: goldenrod;
        }
        article {
            /* width: 200px; */
            height: 100px;
            flex: 1 0 100px;
            max-width: 150px;
            background-color: seagreen;
            padding: 5px;
            margin: 5px;
        }
        article.large {
            flex: 1 0 200px;
            max-width: 300px;
            background-color: aquamarine;
        }
        /* @media screen and (max-width: 220px) {
            .wrapper {
                flex-direction: column;
            }
        } */
    </style>
</head>
<body>
    <div class="wrapper">
        <article>0</article>
        <article>1</article>
        <article>2</article>
        <article>3</article>
        <article>4</article>
        <article class="large">5</article>
        <article>6</article>
        <article>7</article>
        <article>8</article>
    </div>
</body>
</html>
